name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # qmlformat, for the wiring check that Panel.qml and Service.qml parse.
      # Ubuntu ships it in qt6-declarative-dev-tools, at /usr/lib/qt6/bin
      # (there is no `qml-tools` package; asking for one failed every run
      # before the tests started). qmlformat, not qmllint: qmllint resolves
      # types, and every Quickshell and `qs.*` type here lives in Omarchy's
      # shell, which a CI runner doesn't have. Its answer would depend on the
      # machine. qmlformat only parses the grammar, so it gives one answer
      # everywhere.
      - name: Install qmlformat
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
          /usr/lib/qt6/bin/qmlformat --version

      - name: Run Model tests
        run: node test/model.test.js

      - name: Run Wiring checks
        run: node test/wiring.test.js

      - name: Run cloud selection tests
        run: python3 test/selection_test.py

      - name: Run sync-on-change tests
        run: python3 test/watch_test.py

      - name: Run Google client ID tests
        run: python3 test/client_id_test.py

      - name: Run sync progress tests
        run: python3 test/progress_test.py

      - name: Run pause tests
        run: python3 test/pause_test.py
